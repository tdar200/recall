[package]
name = "recall-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Recall shared core: VAD-gated segmentation, on-device ASR, store, summaries (Android now, iOS later via UniFFI)"

[lib]
name = "recall_core"
# cdylib for the Android JNI .so; staticlib for the iOS xcframework; rlib so host tests/benches can link it.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# `bundled` compiles SQLite from source WITH FTS5 (Android's system SQLite lacks FTS5).
# On the NDK build this swaps to `bundled-sqlcipher` for AES-256 encryption-at-rest.
rusqlite = { version = "0.37", features = ["bundled"] }
unsafe-libopus = "0.2.0"
ogg = "0.9.2"

# The ONNX-backed VAD (Silero) and ASR (Parakeet) backends live behind the `onnx`
# feature. Host builds static-link sherpa-onnx (its build.rs downloads the
# prebuilt static lib archive on first build); Android builds link the shared
# lib against the prebuilt jniLibs via SHERPA_ONNX_LIB_DIR (Task 6).
[target.'cfg(not(target_os = "android"))'.dependencies]
sherpa-onnx = { version = "1.13.4", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
sherpa-onnx = { version = "1.13.4", optional = true, default-features = false, features = ["shared"] }

[features]
onnx = ["dep:sherpa-onnx"]
